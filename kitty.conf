# Kitty config for Omarchy (Linux/Wayland).
# Linux/Omarchy port of the macOS config: https://github.com/vyorkin/kitty
#
# macOS-only options (macos_*, Cmd/Super shortcuts, the 36pt camera-notch
# margin, native background blur) were dropped or remapped. Changes vs the
# upstream repo are marked "Linux:" or "Omarchy:" below.
#
# Docs: https://sw.kovidgoyal.net/kitty/conf/

# Omarchy theming. Colors come from the active Omarchy theme; keep this near
# the top so later hard-coded colors (if any) would win.
include ~/.local/state/omarchy/current/theme/kitty.conf

# --- Font -------------------------------------------------------------------
# JuliaMono comes from the repo. It has no Nerd Font glyphs, so icon ranges are
# borrowed from the installed JetBrainsMono Nerd Font instead of the macOS-only
# "Symbols Nerd Font Mono".
font_family      JuliaMono
bold_font        auto
# No italics anywhere: render italic / bold-italic text with the upright faces.
italic_font      family="JuliaMono" style=Regular
bold_italic_font family="JuliaMono" style=SemiBold
font_size 14.0
font_features JuliaMono +ss01 +ss07 +ss13
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e7c5,U+ed00-U+efc1,U+f000-U+f2ff,U+f300-U+f372,U+f400-U+f533,U+f0001-U+f1af0 JetBrainsMono Nerd Font

# --- Cursor -----------------------------------------------------------------
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# --- Text & underlines ------------------------------------------------------
undercurl_style thick-dense
url_style straight

# --- Scrollback -------------------------------------------------------------
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 100
scrollback_fill_enlarged_window yes

# --- Selection & clipboard --------------------------------------------------
copy_on_select clipboard
select_by_word_characters @-./_~?&=%+#:

# --- Mouse ------------------------------------------------------------------
mouse_hide_wait -1

# --- Bell -------------------------------------------------------------------
enable_audio_bell no
visual_bell_duration 0.1
window_alert_on_bell yes

# --- Layouts & splits -------------------------------------------------------
# Linux: kitty_mod stays at its default (ctrl+shift) because SUPER drives
# Hyprland. The repo used SUPER (cmd) here.
#
# Repo mapped splits to kitty_mod+l / kitty_mod+j and window moves to
# kitty_mod+shift+h/j/k/l. With kitty_mod=ctrl+shift, kitty_mod+shift+* would
# collapse onto kitty_mod+*, so the moves use ctrl+shift+alt instead.
enabled_layouts splits, stack
map ctrl+shift+l launch --location=hsplit --cwd=current
map ctrl+shift+j launch --location=vsplit --cwd=current
map ctrl+shift+z toggle_layout stack
map ctrl+shift+alt+h move_window left
map ctrl+shift+alt+j move_window bottom
map ctrl+shift+alt+k move_window top
map ctrl+shift+alt+l move_window right

# --- Window -----------------------------------------------------------------
# Omarchy: kept natively opaque. Transparency + blur are applied by the
# compositor (see ~/.config/hypr/glass.lua and ~/.local/bin/terminal-glass),
# which pins this value back to 1.00 anyway. The repo used background_opacity
# 0.72 + background_blur 24. dynamic_background_opacity and the kitty
# opacity-adjust maps were dropped to avoid a second, conflicting control.
background_opacity 1.00
window_padding_width 0 8 0 8
window_border_width 0
draw_minimal_borders yes

# --- Tab bar -----------------------------------------------------------------
# Tab colors come from the Omarchy theme; only style is set here.
tab_bar_style powerline
tab_bar_min_tabs 1
tab_powerline_style angled
tab_title_template "{index}: {title}"
active_tab_font_style   normal
inactive_tab_font_style normal

# --- Remote control & shell integration -------------------------------------
# Omarchy: listen on Omarchy's socket so `omarchy-cmd-terminal-cwd` can resolve
# the active terminal's working directory. The repo used unix:/tmp/kitty.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}
shell_integration enabled no-cursor

# --- Tabs & navigation ------------------------------------------------------
# Linux: repo used cmd (SUPER) shortcuts, remapped to ctrl+shift.
map ctrl+shift+t new_tab
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
